name: Hostinger Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "USER=$USER" >> "$GITHUB_ENV"

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Verify deployment prerequisites
        run: |
          set -e
          test -f artisan
          test -f composer.json
          test -d public
          test -f public/index.php || true
          echo "Repository structure verified."

      - name: Deploy application files
        run: |
          set -e
          export RSYNC_RSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes"

          rsync -az \
            --exclude='/.env' \
            --exclude='/vendor/' \
            --exclude='/node_modules/' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            --exclude='/public/build/' \
            --exclude='/public/hot' \
            --exclude='/public_html/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.vercel/' \
            --exclude='/certs/' \
            --exclude='/.vscode/' \
            --exclude='*.backup-*' \
            ./ "$USER@$HOST:domains/knowurlocal.site/laravel_app/"

      
      - name: Clear and rebuild Laravel caches
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            'set -e
             cd "$HOME/domains/knowurlocal.site/laravel_app"
             php artisan optimize:clear
             php artisan view:cache
             echo "Laravel caches cleared and Blade views recompiled."'

