name: Hostinger Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  prepare-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Hostinger environment
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            'set -e
             APP="$HOME/domains/knowurlocal.site/laravel_app"
             WEB="$HOME/domains/knowurlocal.site/public_html"
             test -d "$APP"
             test -d "$WEB"
             test -f "$APP/.env"
             test -f "$WEB/index.php"
             command -v php
             echo "Production files and PHP are present. No live files changed."'
